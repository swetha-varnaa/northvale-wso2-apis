openapi: 3.0.3
info:
  title: Northvale Account Statements API
  version: 1.0.0
  description: Mock account statement summaries. Demo data only.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      security:
        - choreoOAuth: []
      responses:
        '200': { description: Service is up }
  /statements/v1/accounts/{accountId}/statements:
    get:
      operationId: getAccountStatement
      summary: Statement summary for one month
      security:
        - choreoOAuth: []
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string }, example: ACC-5001 }
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: 2026-09 }
      responses:
        '200':
          description: Statement summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string }
                  month: { type: string }
                  currency: { type: string }
                  openingBalance: { type: number }
                  closingBalance: { type: number }
                  totalCredits: { type: number }
                  totalDebits: { type: number }
                  transactionCount: { type: integer }
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        description: { type: string }
                        amount: { type: number }
                        balanceAfter: { type: number }
        '400': { description: Invalid month }
components:
  securitySchemes:
    choreoOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://sts.choreo.dev/oauth2/token
          scopes: {}
