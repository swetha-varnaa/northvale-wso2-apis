# Copy to Config.toml (git-ignored) and fill. Secrets are named, never stored here:
# Joget API Builder id/key -> ~/vexa-system/.secrets/env  JOGET_WSO2_API_ID / JOGET_WSO2_API_KEY
# Management API key      -> ~/vexa-system/.secrets/env  WSO2_WORKFLOW_MGMT_API_KEY
# Temporal Cloud key      -> ~/vexa-system/.secrets/env  TEMPORAL_CLOUD_API_KEY
[northvale.joget_workflows]
jogetBaseUrl = "http://localhost:8096/jw/api"   # direct Tomcat port
jogetApiId = ""                 # JOGET_MUF_API_ID in ~/vexa-system/.secrets/wso2-joget-api.env
jogetApiKey = ""                # JOGET_MUF_API_KEY
enableJogetStub = true
rulesFormat = "joget"
mufRulesPath = "/list/list_muf_rule_api?pageSize=500"
mufRecordPath = "/form/muf_wso2_case_view/{id}"
mufStatusPath = "/form/muf_wso2_writeback/saveOrUpdate"
jogetStubPort = 8099
enableEmail = false   # Joget sends every email (V, 5 Nov); true sends WSO2 notifications too
smtpHost = "localhost"
smtpPort = 1026
smtpUser = "workflow"
smtpPassword = "local"
smtpStartTls = false

[ballerina.workflow]
mode = "LOCAL"                 # LOCAL | CLOUD | SELF_HOSTED
url = "localhost:7233"         # CLOUD: <namespace>.<account>.tmprl.cloud:7233
namespace = "default"          # CLOUD: <namespace>.<account>
taskQueue = "JOGET_WORKFLOWS_TASK_QUEUE"
# authApiKey = ""             # CLOUD only, from TEMPORAL_CLOUD_API_KEY

[ballerina.workflow.management.rest]
port = 8234
enableBasicAuth = false
enableApiKey = true
apiKeyHeader = "x-api-key"
apiKeyValue = ""               # from WSO2_WORKFLOW_MGMT_API_KEY
trustForwardedIdentity = true  # Joget sends x-user-id / x-user-roles per call

# Per-app Joget API keys, filled from ~/vexa-system/.secrets/wso2-joget-api.env by scripts/write_config.py
[northvale.joget_workflows.appApiIds]
wso2Desk = ""            # JOGET_WSO2DESK_API_ID
wso2HrLeave = ""         # JOGET_WSO2HRLEAVE_API_ID
wso2Loan = ""            # JOGET_WSO2LOAN_API_ID
wso2Onboarding = ""      # JOGET_WSO2ONBOARDING_API_ID
bizOnboarding = ""       # JOGET_BIZONBOARDING_API_ID

[northvale.joget_workflows.appApiKeys]
wso2Desk = ""            # JOGET_WSO2DESK_API_KEY
wso2HrLeave = ""         # JOGET_WSO2HRLEAVE_API_KEY
wso2Loan = ""            # JOGET_WSO2LOAN_API_KEY
wso2Onboarding = ""      # JOGET_WSO2ONBOARDING_API_KEY
bizOnboarding = ""       # JOGET_BIZONBOARDING_API_KEY
