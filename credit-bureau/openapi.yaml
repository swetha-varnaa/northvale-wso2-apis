openapi: 3.0.3
info:
  title: Northvale Credit Bureau API
  version: 1.0.0
  description: |
    Mock credit bureau for the Loan Origination app. Demo data only. The score is
    derived from nationalIdOrCr, so the same applicant always gets the same score.
    Bands: A 800+, B 700-799, C 600-699, D 500-599, E below 500.
    Recommendation: A/B APPROVE (REVIEW above AED 5,000,000), C REVIEW, D/E DECLINE.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      tags: [ops]
      responses:
        "200": { description: Service is up, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /credit/v1/scores:
    post:
      operationId: createScore
      summary: Score an applicant
      tags: [credit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoreRequest" }
            example: { applicantType: business, nationalIdOrCr: "1234567", name: Desert Pearl Technologies LLC, requestedAmount: 250000, productCode: SME-TL }
      responses:
        "200": { description: Score produced, content: { application/json: { schema: { $ref: "#/components/schemas/Score" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /credit/v1/reports/{scoreId}:
    get:
      operationId: getReport
      summary: Full report for an earlier score, with facility lines
      tags: [credit]
      parameters:
        - { name: scoreId, in: path, required: true, schema: { type: string }, example: CBS-8E2D4C1A90 }
      responses:
        "200": { description: Credit report, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    ScoreRequest:
      type: object
      required: [applicantType, nationalIdOrCr, name, requestedAmount, productCode]
      properties:
        applicantType: { type: string, enum: [business, individual] }
        nationalIdOrCr: { type: string, pattern: "^[A-Za-z0-9-]{4,20}$" }
        name: { type: string }
        requestedAmount: { type: number, exclusiveMinimum: true, minimum: 0 }
        productCode: { type: string }
    Factor:
      type: object
      properties:
        code: { type: string }
        impact: { type: string, enum: [POSITIVE, NEUTRAL, NEGATIVE] }
        description: { type: string }
    Score:
      type: object
      required: [scoreId, score, band, probabilityOfDefault, totalExposure, activeFacilities, delinquencies12m, factors, recommendation]
      properties:
        scoreId: { type: string }
        applicantType: { type: string }
        productCode: { type: string }
        requestedAmount: { type: number }
        score: { type: integer, minimum: 300, maximum: 900 }
        band: { type: string, enum: [A, B, C, D, E] }
        probabilityOfDefault: { type: number, description: 12-month PD as a fraction }
        totalExposure: { type: number }
        currency: { type: string, example: AED }
        activeFacilities: { type: integer }
        delinquencies12m: { type: integer }
        factors: { type: array, items: { $ref: "#/components/schemas/Factor" } }
        recommendation: { type: string, enum: [APPROVE, REVIEW, DECLINE] }
        generatedAt: { type: string, format: date-time }
      example:
        scoreId: CBS-8E2D4C1A90
        applicantType: business
        productCode: SME-TL
        requestedAmount: 250000
        score: 742
        band: B
        probabilityOfDefault: 0.021
        totalExposure: 160000
        currency: AED
        activeFacilities: 2
        delinquencies12m: 0
        factors: [{ code: HIST, impact: POSITIVE, description: Long and clean repayment history }]
        recommendation: APPROVE
        generatedAt: "2026-10-13T09:30:00.000Z"
    Report:
      allOf:
        - $ref: "#/components/schemas/Score"
        - type: object
          properties:
            facilities:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, enum: [TERM_LOAN, OVERDRAFT, CREDIT_CARD, TRADE_FINANCE] }
                  lender: { type: string }
                  outstanding: { type: number }
                  status: { type: string, enum: [CURRENT, PAST_DUE] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [VALIDATION_ERROR, INVALID_JSON, NOT_FOUND, METHOD_NOT_ALLOWED, INTERNAL_ERROR] }
            message: { type: string }
            details: { type: array, items: { type: string } }
      example: { error: { code: VALIDATION_ERROR, message: Request is invalid, details: ["subject.crNumber must be 4-12 digits"] } }
    Health:
      type: object
      properties:
        status: { type: string, example: UP }
        service: { type: string }
  responses:
    BadRequest:
      description: Validation failed or body is not JSON
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

